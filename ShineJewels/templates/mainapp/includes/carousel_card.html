{% load static %}
<div class="card col-12 col-sm-6 col-md-4 col-lg-3 p-0" style="width: 18rem;">
  <img src="{{carousel.image.url}}" class="card-img-top" alt="...">
  <div class="card-body">
    <h5 class="card-title">{{carousel.title}}</h5>
    <p class="card-text">{{carousel.caption}}</p>
  </div>
  <div class="card-body">
    <a href="{% url 'edit_carousel' carousel.id %}" class="btn btn-info">✏️</a>
    <a href="{% url 'del_carousel' carousel.id %}" class="btn btn-danger">🗑️</a>
  </div>
</div>
