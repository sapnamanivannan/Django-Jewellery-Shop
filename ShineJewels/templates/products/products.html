{% extends 'base/base.html' %}

{% block title %}
Products
{% endblock %}

{% block content %}
<section class="d-flex justify-content-center">
    <a href="{% url 'add_product' %}" class="btn btn-dark text-warning mb-4 mt-4 rounded-pill">Add Products</a>
</section>

<section>
    <div class="container-fluid products row mx-auto">
        {% for product in products %}
        {% include 'products/includes/productCard.html' %}
        {% endfor %}
    </div>
</section>
{% endblock %}
